services:
  api:
    build:
      context: ./backend
    image: favorita-api:dev
    # Variables come from your real .env…
    env_file: ./backend/.env
    # …and these override it, so the container always behaves as a dev server on port 5000.
    environment:
      NODE_ENV: development
      PORT: "5000"
    ports:
      - "5000:5000"
    volumes:
      # app.js serves "../../frontend" relative to /app/src, which is /frontend here.
      - ./frontend:/frontend:ro
    develop:
      watch:
        # Edit backend code → copy it into the container and restart node.
        - action: sync+restart
          path: ./backend/src
          target: /app/src
        # Change dependencies → rebuild the image.
        - action: rebuild
          path: ./backend/package.json